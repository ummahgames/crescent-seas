<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crescent Seas · renderer QA</title>
<style>body{margin:0;background:#173a42;color:#efdfb6;font:13px Arial}canvas{position:absolute;inset:0;width:100%;height:100%}aside{position:absolute;top:15px;left:15px;right:15px;background:#12333be8;border:1px solid #e0c48a66;padding:18px;max-width:440px}button,select{background:#d9c28b;color:#15383d;border:0;padding:9px;font:12px Arial;margin:6px 5px 0 0}p{line-height:1.6;color:#b7cebb}h1{font:27px Georgia;margin:10px 0}.note{font-size:10px;color:#d5bb85}</style>
<canvas id="sea"></canvas><aside><div class="note">RENDERER TEST FIXTURE · DOES NOT READ OR WRITE CAPTAIN SAVES</div><h1 id="place"></h1><p id="status"></p><select id="world" aria-label="Test sea"></select><button id="cross">Test charted passage</button><p class="note">The fixture supplies progression clues to exercise the production renderer and world-transition code. The main game requires completed voyages.</p></aside>
<script src="../src/worlds.js"></script><script src="../src/engine.js"></script><script src="../src/renderer.js?v=8"></script><script>
const C=globalThis.Corsair,r=new CorsairRenderer(document.querySelector('canvas'));let state,last=performance.now();
const choose=document.querySelector('select');choose.innerHTML=Object.values(C.WORLDS).map(w=>`<option value="${w.id}">${w.name}</option>`).join('');
function select(id){state=C.create(51,id);state.complete=true;state.voyagesCompleted=3;state.turning.fragments=3;C.updateGate(state);state.player.x=state.gate.x;state.player.z=state.gate.z+200;r.distance=410;r.height=.8;r.follow={x:state.player.x,z:state.player.z};document.querySelector('h1').textContent=C.world(state).name+' · '+C.world(state).year;choose.value=id;}
choose.onchange=()=>select(choose.value);document.querySelector('button').onclick=()=>{if(!state.gate)return;state.player.x=state.gate.x;state.player.z=state.gate.z;C.travel(state,state.gate.destinations[0]);document.querySelector('h1').textContent=C.world(state).name+' · '+C.world(state).year;choose.value=state.worldId;};
window.onresize=()=>r.resize();select('india');function tick(now){const dt=Math.min((now-last)/1000,.05);last=now;state.time+=dt;r.frame(state,dt);const error=r.gl.getError();document.querySelector('#status').textContent=`${state.gate?'Turning Water charted':'Arrived safely at '+C.portById(state,state.checkpoint).name} · WebGL draw: ${error===0?'OK':error}`;requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
